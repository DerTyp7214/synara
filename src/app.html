<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#e6e5e0" media="(prefers-color-scheme: light)" />

		<script>
			// Apply the stored theme before first paint. "light" | "dark" | absent = follow the system.
			(function () {
				try {
					var t = localStorage.getItem('synara-theme');
					if (t === 'light' || t === 'dark') {
						document.documentElement.setAttribute('data-theme', t);
						var c = t === 'light' ? '#e6e5e0' : '#1c1c1e';
						document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
							m.setAttribute('content', c);
						});
					}
				} catch (e) {}
			})();
		</script>
		<style>
			html { background-color: #1c1c1e; color: #edece7; color-scheme: dark; }
			@media (prefers-color-scheme: light) {
				html:not([data-theme='dark']) { background-color: #e6e5e0; color: #1b1b1a; color-scheme: light; }
			}
			html[data-theme='light'] { background-color: #e6e5e0; color: #1b1b1a; color-scheme: light; }
			html[data-theme='dark'] { background-color: #1c1c1e; color: #edece7; color-scheme: dark; }
		</style>

		<meta name="description" content="Synara is a self-hosted lossless music server with native apps for Android and desktop." />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preload" href="/fonts/Barlow-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/BarlowCondensed-600.woff2" as="font" type="font/woff2" crossorigin />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Synara" />
		<meta property="og:title" content="Synara" />
		<meta property="og:description" content="A self-hosted lossless music server with native apps for Android and desktop." />
		<meta property="og:image" content="https://synara.audio/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The Synara ribbon logo next to the words: your music, bit for bit." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Synara" />
		<meta name="twitter:description" content="A self-hosted lossless music server with native apps for Android and desktop." />
		<meta name="twitter:image" content="https://synara.audio/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
